<form (ngSubmit)='onSubmit()'>
<div class="input-group">
    <p>
  <label for="initial-investment">Initial Investment:</label>
  <input type="number" id="initial-investment" name="initial-investment" [ngModel]="initialInvestment()" (ngModelChange)="initialInvestment.set($event)">
    </p>
    <p>
  <label for="annual-investment">Annual Investment:</label>
  <input type="number" id="annual-investment" name="annual-investment" [ngModel]="annualInvestment()" (ngModelChange)="annualInvestment.set($event)">
    </p>
    <p>
  <label for="expected-return">Expected Return:</label>
  <input type="number" id="expected-return" name="expected-return" [ngModel]="expectedReturn()" (ngModelChange)="expectedReturn.set($event)">
    </p>
    <p>
  <label for="duration">Duration:</label>
  <input type="number" id="duration" name="duration" [ngModel]="duration()" (ngModelChange)="duration.set($event)">
    </p>
</div>
<button type="submit">Calculate</button>
</form>
